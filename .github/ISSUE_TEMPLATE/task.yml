name: Task
description: A feature, bug, spike, docs or tech-debt item for the backlog
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options: [Feature, Bug, Spike, Docs, Tech debt]
    validations:
      required: true
  - type: input
    id: epic
    attributes:
      label: Epic
      placeholder: "#2"
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve, and why now?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable conditions. Each must be checkable with a concrete action and result.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: "Depends on #12"
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue deliberately does not cover.
