version: 2
# cooldown: Tomáš's quarantine, no version younger than 3 days (#37, ADR-005).
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      dev-tools:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: uv
    directory: /lab
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
