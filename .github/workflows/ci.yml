name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch cancels the outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job names are required status checks in the `protect-main` ruleset:
  # renaming a job blocks every merge until the ruleset is updated.
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to commit SHAs (tags can be moved); Dependabot bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # --locked fails if uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked
        working-directory: backend
      - run: make check PROJECTS=backend

  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: lab/uv.lock
      - run: uv sync --locked
        working-directory: lab
      - run: make check PROJECTS=lab

  lab-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.17"
          enable-cache: true
          # the cleanup tests also run the backend fault CLI
          cache-dependency-glob: |
            lab/uv.lock
            backend/uv.lock
      - run: uv sync --locked
        working-directory: lab
      - run: make integration
      - name: Lab logs on failure
        if: failure()
        run: docker compose -p chaosnet-lab-test logs
        working-directory: lab
