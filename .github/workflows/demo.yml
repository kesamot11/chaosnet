name: Demo

# The public demo (ADR-012, #237): the static build with the recorded runs, published on
# GitHub Pages when Tomáš publishes a release, so the web shows the released version.
on:
  release:
    types: [published]

# Least privilege: the build only reads the code; the deploy job gets what Pages needs.
permissions:
  contents: read

# One deploy at a time; a running one is not cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to commit SHAs (tags can be moved); Dependabot bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      # Pages serves the project under /chaosnet/, so every file is linked from there.
      - run: npm run build:demo -- --base /chaosnet/
        working-directory: frontend
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write # publish to Pages
      id-token: write # prove to Pages that the artifact comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
