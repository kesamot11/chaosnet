[project]
name = "chaosnet"
version = "0.0.0"
description = "ChaosNet control plane"
authors = [
    { name = "Tomáš Holinka", email = "113046922+kesamot11@users.noreply.github.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: likely bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[project.scripts]
chaosnet-api = "chaosnet.api:main"
chaosnet-fault = "chaosnet.fault_cli:main"
chaosnet-lab = "chaosnet.labgen:main"

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["tests"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
