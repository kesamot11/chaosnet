# Generated from topology.json by `uv run chaosnet-lab` (in backend/), see #73.
# Do not edit: change topology.json and generate again. Valid YAML, written as JSON.
{
  "name": "chaosnet-lab",
  "services": {
    "toxiproxy": {
      "image": "ghcr.io/shopify/toxiproxy:2.12.0",
      "command": [
        "-host=0.0.0.0",
        "-config=/config/toxiproxy.json"
      ],
      "volumes": [
        "./toxiproxy.json:/config/toxiproxy.json:ro"
      ],
      "ports": [
        "127.0.0.1:${TOXIPROXY_PORT:-8474}:8474"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "/toxiproxy-cli",
          "inspect",
          "gateway-orders"
        ],
        "interval": "2s",
        "timeout": "2s",
        "retries": 10,
        "start_period": "10s",
        "start_interval": "1s"
      }
    },
    "watchdog": {
      "build": ".",
      "image": "chaosnet-lab:dev",
      "command": [
        "uvicorn",
        "chaosnet_lab.watchdog:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=1)"
        ],
        "interval": "2s",
        "timeout": "2s",
        "retries": 10,
        "start_period": "10s",
        "start_interval": "1s"
      },
      "ports": [
        "127.0.0.1:${WATCHDOG_PORT:-8475}:8000"
      ],
      "environment": {
        "TOXIPROXY_URL": "http://toxiproxy:8474",
        "LEASE_TIMEOUT_S": "${LEASE_TIMEOUT_S:-5}",
        "CHECK_INTERVAL_S": "${CHECK_INTERVAL_S:-0.5}"
      },
      "depends_on": {
        "toxiproxy": {
          "condition": "service_healthy"
        }
      }
    },
    "prometheus": {
      "image": "prom/prometheus:v3.15.1",
      "command": [
        "--config.file=/etc/prometheus/prometheus.yml"
      ],
      "volumes": [
        "./prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      ],
      "ports": [
        "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:9090/-/ready"
        ],
        "interval": "2s",
        "timeout": "2s",
        "retries": 10,
        "start_period": "10s",
        "start_interval": "1s"
      }
    },
    "gateway": {
      "build": ".",
      "image": "chaosnet-lab:dev",
      "command": [
        "uvicorn",
        "chaosnet_lab.service:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=1)"
        ],
        "interval": "2s",
        "timeout": "2s",
        "retries": 10,
        "start_period": "10s",
        "start_interval": "1s"
      },
      "environment": {
        "SERVICE_NAME": "gateway",
        "CALLS": "[{\"hop\": \"gateway->orders\", \"url\": \"http://toxiproxy:8665\", \"timeout_s\": 2.0, \"max_retries\": 1}]"
      },
      "depends_on": {
        "orders": {
          "condition": "service_healthy"
        },
        "toxiproxy": {
          "condition": "service_healthy"
        }
      },
      "ports": [
        "127.0.0.1:${ENTRY_PORT:-8080}:8000"
      ]
    },
    "orders": {
      "build": ".",
      "image": "chaosnet-lab:dev",
      "command": [
        "uvicorn",
        "chaosnet_lab.service:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=1)"
        ],
        "interval": "2s",
        "timeout": "2s",
        "retries": 10,
        "start_period": "10s",
        "start_interval": "1s"
      },
      "environment": {
        "SERVICE_NAME": "orders",
        "CALLS": "[{\"hop\": \"orders->inventory\", \"url\": \"http://toxiproxy:8666\", \"timeout_s\": 0.5, \"max_retries\": 2}]"
      },
      "depends_on": {
        "inventory": {
          "condition": "service_healthy"
        },
        "toxiproxy": {
          "condition": "service_healthy"
        }
      }
    },
    "inventory": {
      "build": ".",
      "image": "chaosnet-lab:dev",
      "command": [
        "uvicorn",
        "chaosnet_lab.service:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=1)"
        ],
        "interval": "2s",
        "timeout": "2s",
        "retries": 10,
        "start_period": "10s",
        "start_interval": "1s"
      },
      "environment": {
        "SERVICE_NAME": "inventory",
        "CALLS": "[]"
      },
      "depends_on": {}
    }
  }
}
